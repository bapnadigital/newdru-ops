name: Deploy to mynewdru.in

# Deploys main to Cloudflare. The "production" environment must be set to
# require Shubham's approval (Settings > Environments > production >
# Required reviewers), so nothing goes live without him clicking Approve.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install deploy tools
        run: npm ci --no-audit --no-fund
      - name: Deploy (builds the container image and rolls it out)
        env:
          # Scoped Cloudflare API token, stored ONLY in the production environment.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke test
        run: |
          sleep 30
          curl -fsS https://mynewdru.in/api/health
