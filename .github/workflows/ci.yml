name: Checks

# Runs on every pull request. A pull request cannot be merged until this passes
# (turn on "Require status checks" in branch protection).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Security tests (offline, in-memory database)
        working-directory: backend
        run: pytest tests/test_security.py -q
      - name: Known-vulnerable packages
        run: pip install pip-audit && pip-audit -r backend/requirements.txt

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ""
          CI: "false"
          GENERATE_SOURCEMAP: "false"
        run: |
          corepack enable
          yarn install --frozen-lockfile --ignore-engines
          yarn build
      - name: No third-party trackers in the page
        run: |
          if grep -RniE "emergent|posthog" frontend/build; then
            echo "Tracking or Emergent code found in the build"; exit 1; fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner
